<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- add css -->
    <link rel="stylesheet" href="style.css">
    <!-- add bootstrap -->
    <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css">
    <!-- bootstrap icons -->
     <link rel="stylesheet" href="./node_modules/bootstrap-icons/font/bootstrap-icons.min.css">
    <title>MovieList</title>
</head>
<body>
    <!-- start project -->
   <div class="bg-dark col-12  d-flex flex-wrap flex-column justify-content-center align-content-center p-4">
        <!-- header -->
        <div class="header bg-white rounded-4 col-12 d-flex flex-row flex-nowrap justify-content-between p-2 align-item-center"> 
            
            <h3 class="mt-2 headerTitle"><i class="bi bi-film"></i> Movie Tracker</h3>
            <!-- <img src="./images/pngtree-film-logo-design-template-vector-isolated-illustration-png-image_1693431.jpg" alt="logo" class="logo rounded-circle" width="50px"> -->
             <div class="d-flex flex-row flex-nowrap justify-content-right">
                <button class="btn filter-btn bi bi-funnel-fill"></button>
                <button class="btn removal-btn  bi bi-trash-fill" id="removalBtn" ></button>

             </div>
        </div>
        <!-- add movie section -->
         <div class="add mt-4 d-flex flex-row flex-nowrap col-10 offset-1 justify-content-center align-content-center ">
            <input type="text" name="move" id="addMovie" class="col-5 mt-1 ">
            <button id="addBtn" type="button" class="">ADD</button>
         </div>
         <!-- section movie list and filter movie -->
         <div class="secondPart position-relative d-flex flex-row flex-nowrap bg-dark p-2 col-12 mt-3">
            <!-- movie list -->
            <div id="listM"  class=" col-6 p-2">
                <h4 class="tilte" >Movies :</h4>
                <ul id="movieList" class="col-12 ">                    
                </ul>
                
            </div>
            <div id="removalPart" class="p-2 col-6 d-none ">
                <h4 class="title">deleted movies:</h4>
                <div id="deletedMovies" ></div>
            </div>
           
            <!-- options part -->
            <div id="options" class="d-flex flex-column  flex-wrap col-6  justify-content-center align-content-center">
                <div class="filters">
                    
                </div>
                <button class="btn movies-btn d-none" id="moviesBtn" >MOVIE LIST</button>

            </div>
         </div>

   </div>
</body>

<script src="./node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
<script src="./main.js"></script>
</html>
